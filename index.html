<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OncoGrid Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #oncoGrid { border: 1px solid #ccc; }

        /* OncoGrid styles */
        .background {
            fill: transparent;
        }

        .og-maingrid-svg .background {
            fill: transparent;
        }

        /* grid lines */
        .og-donor-column, .og-gene-row line {
            stroke: #ddd;
            stroke-width: 1px;
        }

        /* histogram axis lines */
        .og-histogram-axis {
            stroke: #ccc;
            stroke-width: 1px;
        }

        /* label text */
        .og-label-text-font {
            font-size: 11px;
            fill: #333;
        }

        /* crosshair */
        .og-vertical-cross, .og-horizontal-cross {
            stroke: #f00;
            stroke-width: 1px;
        }
    </style>
</head>
<body>
<h2>OncoGrid Test</h2>
<div id="oncoGrid"></div>

<script src="dist/oncogrid-debug.js"></script>
<script>
    function generateRows() {
        return [
            { "id": "1", "symbol": "chr1p" },
            { "id": "2", "symbol": "chr1q" },
            { "id": "3", "symbol": "chr2p" },
            { "id": "4", "symbol": "chr2q" },
            { "id": "5", "symbol": "chr3p" },
            { "id": "6", "symbol": "chr3q" },
            { "id": "7", "symbol": "chr4p" },
            { "id": "8", "symbol": "chr4q" },
            { "id": "9", "symbol": "chr5p" },
            { "id": "10", "symbol": "chr5q" },
            { "id": "11", "symbol": "chr6p" },
            { "id": "12", "symbol": "chr6q" },
            { "id": "13", "symbol": "chr7p" },
            { "id": "14", "symbol": "chr7q" },
            { "id": "15", "symbol": "chr8p" },
            { "id": "16", "symbol": "chr8q" },
            { "id": "17", "symbol": "chr9p" },
            { "id": "18", "symbol": "chr9q" },
            { "id": "19", "symbol": "chr10p" },
            { "id": "20", "symbol": "chr10q" },
            { "id": "21", "symbol": "chr11p" },
            { "id": "22", "symbol": "chr11q" },
            { "id": "23", "symbol": "chr12p" },
            { "id": "24", "symbol": "chr12q" },
            { "id": "25", "symbol": "chr14p" },
            { "id": "26", "symbol": "chr14q" },
            { "id": "27", "symbol": "chr15p" },
            { "id": "28", "symbol": "chr15q" },
            { "id": "29", "symbol": "chr16p" },
            { "id": "30", "symbol": "chr16q" },
            { "id": "31", "symbol": "chr17p" },
            { "id": "32", "symbol": "chr17q" },
            { "id": "33", "symbol": "chr18p" },
            { "id": "34", "symbol": "chr18q" },
            { "id": "35", "symbol": "chr19p" },
            { "id": "36", "symbol": "chr19q" },
            { "id": "37", "symbol": "chr20p" },
            { "id": "38", "symbol": "chr20q" },
            { "id": "39", "symbol": "chr21p" },
            { "id": "40", "symbol": "chr22q" },
            { "id": "41", "symbol": "chr23p" },
            { "id": "42", "symbol": "chr23q" },
            { "id": "43", "symbol": "chrXp" },
            { "id": "44", "symbol": "chrXq" },
            { "id": "45", "symbol": "chrYp" },
            { "id": "46", "symbol": "chrYq" }
        ];
    }

    function generateColumns(count) {
        let columns = [];

        for(let i = 0; i < count; i++) {
            let id = (i + 1).toString();
            columns.push({ "id": id, "displayId": "D00" + id });
        }

        return columns;
    };

    function getRandomConsequenceIndex() {
        var rand = Math.random();
        if (rand < 0.60) {
            return 2; // neutral - 60%
        } else if (rand < 0.80) {
            return 0; // gain - 20%
        } else {
            return 1; // loss - 20%
        }
    }

    function generateObservations(columns, rows) {
        let observations = [];
        let consequences = [ "gain", "loss", "neutral" ];


        for (let i = 0; i < rows.length; i++) {
            for (let j = 0; j < columns.length; j++) {
                let consequenceIndex = getRandomConsequenceIndex();

                if(consequenceIndex != 2) {
                    let id = (i * rows.length + j + 1).toString();
                    observations.push({ "id": id, "donorId": columns[j].id, "geneId": rows[i].id, "type": "mutation", "consequence": consequences[consequenceIndex], "ids": [id] });
                }
            }
        }

        return observations;
    }

    let rows = generateRows();
    let columns = generateColumns(2);
    let observations = generateObservations(columns, rows);

    var grid = new UniteOncoGrid({
        element: '#oncoGrid',
        donors: columns,
        genes: rows,
        ssmObservations: observations,
        colorMap: {
            mutation: {
                gain:       'red',
                loss:       'blue',
                neutral:    'gray'
            }
        },
        width: 800,
        height: 300,
        scaleToFit: true
    });

    grid.render();
</script>
</body>
</html>
