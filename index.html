<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OncoGrid sample playground</title>
    <style>
        :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
        body { margin: 0; background: #f6f7f9; color: #1f2933; }
        main { width: min(1440px, calc(100% - 32px)); margin: 24px auto 48px; }
        h1 { margin: 0 0 6px; font-size: 1.6rem; }
        .intro { margin: 0 0 16px; color: #52606d; }
        .panel { background: #fff; border: 1px solid #d9e2ec; border-radius: 10px; padding: 16px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        button { border: 1px solid #bcccdc; border-radius: 6px; background: #fff; padding: 7px 11px; cursor: pointer; }
        button:hover { background: #f0f4f8; }
        #stats { margin: 0 0 10px; font-size: 0.9rem; color: #52606d; }
        .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; font-size: 0.85rem; }
        .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 2px; background: var(--color); }
        #grid { width: 100%; overflow: hidden; }
        #details { margin: 14px 0 0; min-height: 54px; padding: 10px; border-radius: 6px; background: #f5f7fa; white-space: pre-wrap; font: 0.78rem/1.45 ui-monospace, monospace; }
    </style>
</head>
<body>
<main>
    <h1>OncoGrid sample playground</h1>
    <p class="intro">A deterministic 15 × 30 dataset with empty cells and cells containing multiple event types.</p>

    <section class="panel">
        <div class="toolbar">
            <button id="toggle-grid" type="button">Toggle grid lines</button>
            <button id="toggle-crosshair" type="button">Toggle crosshair</button>
            <button id="toggle-heatmap" type="button">Toggle heat map</button>
            <button id="cluster" type="button">Cluster</button>
            <button id="reset" type="button">Reset</button>
        </div>
        <p id="stats"></p>
        <div id="legend" class="legend"></div>
        <div id="grid"></div>
        <pre id="details">Hover over or click an event cell to inspect its generic payload.</pre>
    </section>
</main>

<script src="test/data/sample-data.js"></script>
<script type="module" src="/test/playground.ts"></script>
</body>
</html>
