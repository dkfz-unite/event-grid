    Now I can give you a precise answer based on the actual source. Let me trace the full sorting flow.
    
    Where sorting happens — exactly
    On every initCharts() call (including reload())
    js
    _self.computeGeneScoresAndCount();  // sets gene.score = total mutation count across all donors
    _self.genesSortbyScores();          // sorts genes array by that score descending
    _self.computeScores();              // sets donor.score based on current gene order
    _self.sortByScores();               // sorts donors by that score descending
    _self.calculatePositions();         // assigns x/y pixel positions to sorted arrays
    So the initial gene order is always overwritten — whatever order your backend returns data.genes in is completely irrelevant. OncoGrid always resets to score-based order on init and reload.
    
    The gene score formula (computeGeneScoresAndCount)
    js
    gene.score += _self.mutationGeneScore(donor.id, gene.id);
    // mutationGeneScore returns the count of individual mutations (flattened nested arrays)
    So gene.score = total number of mutations across all donors for that gene. Genes with more mutations → higher rows.
    
    The donor score formula (computeScores)
    js
    donor.score += mutationScore(donor.id, gene.id) * Math.pow(2, genes.length + 1 - j);
    This is a binary weighted sum — genes sorted earlier (more mutated) are given exponentially higher weight. A donor with a mutation in gene #0 scores 2^(n+1), while a mutation in gene #n scores 2^1. This is what creates the diagonal clustering pattern.
    
    cluster() vs initial render — they're identical
    js
    OncoGrid.prototype.cluster = function() {
    _self.genesSortbyScores();
    _self.computeScores();
    _self.sortByScores();
    _self.update(_self)();
  };
    This is exactly the same sequence as initCharts. So your currently-commented-out toggleCluster() would just re-apply the same sort that already happened on load — it only makes a visual difference if the user has manually dragged rows around in between.
    
    sortGenes(fn) has a subtle quirk
    js
    OncoGrid.prototype.sortGenes = function(func) {
    _self.computeScores();   // ← recomputes donor scores first
    _self.sortByScores();    // ← re-sorts donors by score
    _self.genes.sort(func);  // ← THEN applies your custom gene sort
    _self.update(_self)();
  };
    Your custom comparator is applied last, after donors are already re-scored. The donor re-sort won't match your custom gene order — it scores donors against the score-based gene order, then you reorder genes. Worth knowing if you want donors to reflect your custom gene ordering.
    
    What this means for your component
    reloadGrid() will always sort by mutation count, regardless of data.genes order, because reload() calls initCharts(true) which runs the full scoring pipeline again.
    
    There is no way to disable the initial sort without modifying OncoGrid's source — genesSortbyScores() is unconditionally called in initCharts() with no param to skip it.

  If you want a different default ordering (e.g. genomic position), your cleanest options are:

