    push:
      branches:
        - develop

  jobs:
    publish:
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write

      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: '22'
            registry-url: 'https://npm.pkg.github.com'
            scope: '@dkfz-unite'

        - run: npm install

        - run: node build.js

