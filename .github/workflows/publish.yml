    Where sorting happens in the source
  There are three distinct places in OncoGrid's codebase where gene sorting occurs:

    1. Initial render — this.genes array order
  When render() is called, OncoGrid simply iterates this.genes in the order it received them. No sorting is applied automatically at startup. So the initial row order is whatever order you pass this.data.genes from your backend. In your component:

    js
  genes: this.data.genes  // ← this order IS the initial row order
    2. cluster() — the internal scoring sort
  This is what your toggleCluster() button calls. Inside OncoGrid's source, cluster() does two things in sequence:

  1. Sort genes:    genes.sort((a, b) => b.count - a.count)
    (count = total observations for that gene)

  2. Score donors:  for each donor, score = sum of (genes.length - geneIndex)
    for every observation that donor has
    (earlier/more-mutated genes give higher scores)

  3. Sort donors:   donors.sort((a, b) => b.score - a.score)
    The donor re-scoring is what makes the diagonal pattern appear — donors who share mutations in the same top genes cluster together.
    
    3. sortGenes(fn) — the public imperative API
    This is the direct hook. It accepts a standard JS comparator, re-renders, then re-scores and re-sorts donors to match.
    
