    Here's a thorough breakdown of oncojs/oncogrid's code architecture, based on the repository structure and API docs.
    
    Overview
    OncoGrid is a JavaScript library for visualizing OncoGrids and related tracks, originally built for the International Cancer Genome Consortium (ICGC). It renders a 2D mutation grid where rows are genes, columns are donors (patients), and each cell is shaded by observed mutation type. It depends on D3 and is built with Gulp, and is licensed under MIT/Apache-2.0.
    GitHub
    Libraries.io
    
    Repository layout
  The repo (on the develop branch) has four main folders:

    src/ — all source JavaScript modules
    dist/ — compiled oncogrid.min.js and debug builds
    test/ — unit and integration tests
    images/ — README assets (the animated GIF demo)
  Configuration lives at the root: gulpfile.js for the build, bower.json for test-time dependencies, .jshintrc for linting, and package.json for npm.
    
    Architectural layers
    1. Public facade — OncoGrid class
    
    Once D3 and OncoGrid have been added to a page, you instantiate it with a params object and call grid.render(). This class is the single public entry point. It owns the lifecycle methods — render(), resize(width, height), cluster(), removeDonors(function), removeGenes(function), toggleHeatmap(), toggleGridLines(), toggleCrosshair(), sortDonors(function), sortGenes(function), and destroy().
    GitHub
    GitHub
    
    OncoGrid extends eventemitter3, so the class also acts as an observable event bus — callers can do grid.on('gridClick', fn) without managing listeners themselves.
    GitHub
    
    2. Rendering layer — MainGrid, Histogram, Track

  These are the three visual sub-components, each responsible for a different region of the canvas:

    MainGrid — renders the core mutation grid as SVG <rect> cells. It handles heatmap mode (continuous opacity from mutation count) vs regular mode (discrete color per consequence type), and crosshair mode for detailed cell inspection.
    Histogram — draws the bar charts above (donor mutation count) and to the left (gene mutation count) of the grid. Mouse events like histogramClick and histogramMouseOver fire callbacks with the domain info.
    GitHub
    Track — renders the annotation rows below (donor tracks) and to the right (gene tracks) of the grid. Each track object has name, fieldName, type, sort, group, and optionally collapsed, allowing flexible grouping and expandable track panels.
    GitHub
    3. D3 as the rendering engine
    
    The library depends on D3 for all SVG manipulation — scales, axes, drag behavior, zoom, and data-join rendering. There is no virtual DOM or framework; everything is direct imperative SVG construction via D3 selections.
    GitHub
    
    4. Data model

  Three required arrays are passed via params: donors (each with at minimum an id), genes (each with at minimum an id), and observations (each requiring id, geneId, and donorId). Observations are the cross-product lookup — the library does its own indexing internally to map which mutations land in which cell.
    GitHub
    
    Track definitions are separate arrays (donorTracks, geneTracks) that describe which metadata fields to render per row and how to sort them.
    
    5. Event system

  The library emits two categories of events:

    Mouse events — gridClick, gridMouseOver, gridMouseOut, gridCrosshairMouseOver, trackClick, trackMouseOver, trackLegendMouseOver, histogramClick, addTrackClick, all with relevant domain data passed to the callback.
    GitHub
    Timing events — render:mainGrid:start/end, render:donorHistogram:start/end, render:geneTrack:start/end, etc. — useful for performance instrumentation.
    GitHub
    Notable design decisions
    No framework dependency. The library is framework-agnostic vanilla JS + D3, making it embeddable in React, Angular, or plain HTML with a simple <script> tag.
    Params-driven configuration. All behavior — sizing, color maps, opacity functions, sort functions, expandable groups — is injected through the constructor's params object rather than subclassing. Optional params include colorMap, donorOpacityFunc, geneFillFunc, addTrackFunc, expandableGroups, scaleToFit, and leftTextWidth.
    GitHub
    Build tooling is Gulp + Bower — reflecting its 2016–2018 vintage. The build pipeline produces a minified bundle via gulp.
    Libraries.io
    Maintenance status is inactive — the last npm release was in 2018 and the repository has seen minimal recent activity. If you're integrating it today, you'd likely want to fork or wrap it.
