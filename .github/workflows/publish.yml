    The crash is a Node.js compatibility problem. You're running Node 25 (node/25.3.0), but the Gulp 3 build chain (specifically the natives and graceful-fs packages it pulls in) is ancient and crashes on any Node newer than ~12.

  You have two options:

    Option A — Use an older Node version (quick fix)
  If you have nvm:

    bash
    nvm install 12
    nvm use 12
    npm install
    gulp
  Or with brew:

    bash
    brew install node@12
    export PATH="/opt/homebrew/opt/node@12/bin:$PATH"
    npm install
    gulp
    This is the fastest path but ugly long-term.
    
    Option B — Replace the build with a modern bundler (recommended)
    The Gulp 3 + Browserify setup is the problem. Replace it with a one-liner using browserify directly or esbuild, which works fine on Node 25.

  Install esbuild as the new build tool:

    bash
    npm install --save-dev esbuild
  Replace gulpfile.js with a simple build script — add build.js at the repo root:

    js
    const esbuild = require('esbuild');
    
    esbuild.build({
  entryPoints: ['src/OncoGrid.js'],
  bundle: true,
  minify: true,
  outfile: 'dist/oncogrid.min.js',
  format: 'iife',
  globalName: 'OncoGrid',
  platform: 'browser',
  }).then(() => {
  console.log('Build complete: dist/oncogrid.min.js');
  }).catch(() => process.exit(1));
  Also add an unminified debug build:

