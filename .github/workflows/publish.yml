  Looking at your component, the sorting of genes happens through a combination of OncoGrid's internal logic and how you trigger it. Let me break it down:

    Default sorting (on initial render)
    When initializeGrid is called and render() runs, OncoGrid sorts genes internally by mutation count — genes with the most observations across donors appear at the top.
    
    Your component's explicit sort trigger
  You have toggleCluster():

    js
    toggleCluster() {
    this.oncoGrid.cluster();
  }
  This calls OncoGrid's cluster() method, which performs a two-pass sort:

    Sorts genes by total mutation count (descending)
    Re-scores donors based on those gene positions, then re-sorts donors too
    This is the "smart" sort that groups the most mutated genes/donors together for clearer visual clustering.
    
    What's missing in your component
  You don't pass a geneTracks or custom sortGenes call, so there's no custom gene sort function wired up. If you wanted to sort genes by a specific field (e.g. chromosome position, gene name), you'd add something like:

    js
    this.oncoGrid.sortGenes((a, b) => a.symbol.localeCompare(b.symbol));
    The reset path
    In reloadGrid(), you call this.oncoGrid.reload() — this resets genes back to the original order they were passed in via this.data.genes. So the sort order ultimately traces back to whatever order your backend/API returns data.genes in, before any clustering is applied.

  In short: genes are sorted by mutation count by default, cluster re-sorts them optimally, and reset restores the original data.genes array order.
    
